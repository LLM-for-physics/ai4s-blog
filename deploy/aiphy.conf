# HTTP Server - 用于 certbot 验证（证书申请成功前的临时配置）
server {
    listen 80;
    server_name aiphy.pku.edu.cn;
    
    root /var/www/ai4s-site/current;
    index index.html;
    
    include /etc/nginx/snippets/ai4s-llm.conf;

    # Current and archived static sites. Keep this include in the active HTTPS server too.
    include /etc/nginx/snippets/ai4s-static.conf;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Temporarily disable CSP to test if it's causing the outline issue
    # add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
    
    # Deny access to hidden files (except .well-known for certbot)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
