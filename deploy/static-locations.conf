# Included inside every server serving the course site (HTTP and HTTPS).
# Private data is never a static website asset. Regex locations precede the asset rule.
location ~* ^/(?:archive/[^/]+/)?(?:score|feedback)(?:/|$) { return 404; }
location ~* \.(?:xlsx?|jsonl)$ { return 404; }
location = /api/feedback/submit { return 404; }
location = /api/page-content { return 404; }

# Generated assets are content-hashed. Fixed-name downloads are revalidated.
location ~* ^/(?:archive/[^/]+/)?assets/.*\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location /archive/2025-fall/ {
    add_header Cache-Control "no-cache";
    error_page 404 /archive/2025-fall/404.html;
    try_files $uri $uri/ $uri.html =404;
}
location /archive/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html =404;
}
location / {
    add_header Cache-Control "no-cache";
    error_page 404 /404.html;
    try_files $uri $uri/ $uri.html =404;
}
