server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiphy.pku.edu.cn;

    ssl_certificate /etc/letsencrypt/live/aiphy.pku.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiphy.pku.edu.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Route chat directly; avoid buffering through the HTTP fallback.
    include /etc/nginx/snippets/ai4s-llm.conf;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
