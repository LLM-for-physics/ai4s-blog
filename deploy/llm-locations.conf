# Include in the public HTTPS server (and HTTP server if it serves API requests).
    # Only expose the chat endpoint. Credentials are installed separately on the server.
    location = /api/llm/chat/completions {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        proxy_pass https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions;
        include /etc/nginx/secrets/ai4s-llm.conf;
        proxy_set_header Content-Type application/json;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store" always;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/llm/ { return 404; }
