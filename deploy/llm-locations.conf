# Include in the public HTTPS server (and HTTP server if it serves API requests).
# Chat requests go to the local llm-proxy service: it validates the body, owns the
# system prompt and model choice, rate-limits, and holds the upstream credential.
# Nginx must not inject credentials or forward client bodies to the model API anymore.
    location = /api/llm/chat/completions {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # Login-free session issuance (SRC #592591): the service sets the HttpOnly quota
    # cookie; nginx only forwards, the Cookie/Set-Cookie headers pass through by default.
    location = /api/llm/session {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
    location /api/llm/ { return 404; }
