# 190 only: include in the port-80 aiphy vhost behind the verified campus HTTPS gateway (162.105.120.173).
# Gateway HTTPS termination and HTTP-to-HTTPS redirect were verified; it does not send X-Forwarded-Proto.
# Direct access to this HTTP upstream is denied. Preserve existing LLM and static locations.
location = /api/course-keys/admin/roster/preview {
    allow 162.105.120.173;
    deny all;
    client_max_body_size 2064k;
    client_body_buffer_size 32k;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
location = /api/course-keys/me/key {
    allow 162.105.120.173;
    deny all;
    client_max_body_size 16k;
    client_body_buffer_size 32k;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
location ^~ /api/course-keys/ {
    allow 162.105.120.173;
    deny all;
    client_max_body_size 64k;
    client_body_buffer_size 128k;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
